name: PyPI-ga avtomatik yuklash

on:
  push:
    tags:
      - 'v*' # Faqat v1.0.8, v1.0.9 kabi versiya teglari push qilinganda ishlaydi

jobs:
  build-n-publish:
    name: Paketni yig'ish va PyPI-ga jo'natish
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklab olish
      uses: actions/checkout@v4

    - name: Python muhitini sozlash
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Build vositalarini o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Paketni arxivlash (Build)
      run: python -m build

    - name: PyPI-ga xavfsiz yuklash
      uses: pypa/github-action-pypi-publish@v1.8.14
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
