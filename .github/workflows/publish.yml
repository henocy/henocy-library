name: PyPI-ga avtomatik yuklash

on:
  push:
    tags:
      - 'v*'

jobs:
  build-n-publish:
    name: Paketni yig'ish va PyPI-ga jo'natish
    runs-on: ubuntu-latest
    
    # OIDC uchun ruxsatnomalar:
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Kodni yuklab olish
      uses: actions/checkout@v4 # Oxirgi versiyaga yangilandi

    - name: Python muhitini sozlash
      uses: actions/setup-python@v5 # Oxirgi versiyaga yangilandi
      with:
        python-version: "3.10"

    - name: Build vositalarini o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Paketni arxivlash (Build)
      run: python -m build

    - name: PyPI-ga xavfsiz yuklash
      uses: pypa/github-action-pypi-publish@release/v1 # To'g'rilangan variant
      # password kerak emas! PyPI buni GitHub orqali avtomatik tekshiradi.
